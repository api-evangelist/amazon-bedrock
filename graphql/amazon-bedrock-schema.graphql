  outputModalities: [ModelModalityType!]!
  responseStreamingSupported: Boolean
  customizationsSupported: [CustomizationType!]
  inferenceTypesSupported: [InferenceType!]
  modelLifecycle: ModelLifecycle
  bedrockReadyEnabled: Boolean
}

type ModelLifecycle {
  status: ModelStatus!
}

type FoundationModelSummary {
  modelId: ID!
  modelName: String!
  providerName: String!
  modelArn: String!
  inputModalities: [ModelModalityType!]
  outputModalities: [ModelModalityType!]
  responseStreamingSupported: Boolean
  customizationsSupported: [CustomizationType!]
  inferenceTypesSupported: [InferenceType!]
  modelLifecycle: ModelLifecycle
}

