"""
Amazon Bedrock GraphQL Schema
Conceptual schema derived from the Amazon Bedrock REST API.
Covers: model invocation, agents, knowledge bases, guardrails,
model evaluation, provisioned throughput, and custom model fine-tuning.
"""

# ─────────────────────────────────────────────
# Scalars
# ─────────────────────────────────────────────

scalar AWSDateTime
scalar AWSJSON
scalar Long

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum ModelStatus {
  ACTIVE
  LEGACY
  DEPRECATED
}

enum CustomizationType {
  FINE_TUNING
  CONTINUED_PRE_TRAINING
  DISTILLATION
}

enum CustomizationJobStatus {
  InProgress
  Completed
  Failed
  Stopping
  Stopped
}

enum ModelModalityType {
  TEXT
  IMAGE
  EMBEDDING
}

enum ProvisionedThroughputStatus {
  Creating
  InService
  Updating
  Failed
  Deleting
}

enum CommitmentDuration {
  OneMonth
  SixMonths
}

enum GuardrailStatus {
  DRAFT
  READY
  FAILED
  DELETING
}

enum GuardrailFilterStrength {
  NONE
  LOW
  MEDIUM
  HIGH
}

enum GuardrailAction {
  NONE
  BLOCKED
}

enum AgentStatus {
  CREATING
  PREPARING
  PREPARED
  NOT_PREPARED
  DELETING
  FAILED
  VERSIONING
  UPDATING
}

enum AgentAliasStatus {
  CREATING
  PREPARED
  FAILED
  UPDATING
  DELETING
}

enum KnowledgeBaseStatus {
  CREATING
  ACTIVE
  DELETING
  UPDATING
  FAILED
  DELETE_UNSUCCESSFUL
}

enum DataSourceStatus {
  AVAILABLE
  DELETING
  DELETE_UNSUCCESSFUL
}

enum IngestionJobStatus {
  STARTING
  IN_PROGRESS
  COMPLETE
  FAILED
  STOPPING
  STOPPED
}

enum VectorStorageType {
  OPENSEARCH_SERVERLESS
  PINECONE
  REDIS_ENTERPRISE_CLOUD
  RDS
  MONGO_DB_ATLAS
}

enum EmbeddingModelDataType {
  FLOAT32
  BINARY
}

enum ModelEvaluationJobStatus {
  InProgress
  Completed
  Failed
  Stopping
  Stopped
  Deleting
}

enum ModelEvaluationTaskType {
  Summarization
  Classification
  QuestionAndAnswer
  Generation
  Custom
}

enum InferenceType {
  ON_DEMAND
  PROVISIONED
  ENDPOINT
}

enum SortOrder {
  Ascending
  Descending
}

enum StopReason {
  end_turn
  max_tokens
  stop_sequence
  tool_use
  guardrail_intervened
  content_filtered
}

enum ContentBlockType {
  text
  image
  tool_use
  tool_result
  document
  thinking
  redirect_tool_result
}

enum ImageFormat {
  jpeg
  png
  gif
  webp
}

enum DocumentFormat {
  pdf
  csv
  doc
  docx
  xls
  xlsx
  html
  txt
  md
}

enum ToolChoiceType {
  AUTO
  ANY
  TOOL
}

enum FlowStatus {
  Failed
  Prepared
  Preparing
  NotPrepared
}

