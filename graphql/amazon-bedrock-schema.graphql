}

type GuardrailSummary {
  id: ID!
  arn: String!
  name: String!
  description: String
  status: GuardrailStatus!
  version: String!
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type GuardrailTopicPolicy {
  topics: [GuardrailTopic!]!
}

type GuardrailTopic {
  name: String!
  definition: String!
  examples: [String!]
  type: String
}

type GuardrailContentPolicy {
  filters: [GuardrailContentFilter!]!
}

type GuardrailContentFilter {
  type: String!
  inputStrength: GuardrailFilterStrength!
  outputStrength: GuardrailFilterStrength!
}

type GuardrailWordPolicy {
  words: [GuardrailWord!]
  managedWordListsConfig: [GuardrailManagedWordsList!]
}

type GuardrailWord {
  text: String!
}

type GuardrailManagedWordsList {
  type: String!
}

type GuardrailSensitiveInformationPolicy {
  piiEntities: [GuardrailPiiEntity!]
  regexes: [GuardrailRegex!]
}

type GuardrailPiiEntity {
  type: String!
  action: GuardrailAction!
}

type GuardrailRegex {
  name: String!
  description: String
  pattern: String!
  action: GuardrailAction!
}

type GuardrailContextualGroundingPolicy {
  filters: [GuardrailContextualGroundingFilter!]!
}

type GuardrailContextualGroundingFilter {
  type: String!
  threshold: Float!
}

