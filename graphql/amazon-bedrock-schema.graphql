# ─────────────────────────────────────────────
# Query Root
# ─────────────────────────────────────────────

type Query {
  # Foundation Models
  listFoundationModels(
    byProvider: String
    byCustomizationType: CustomizationType
    byOutputModality: ModelModalityType
    byInferenceType: InferenceType
  ): FoundationModelConnection!

  getFoundationModel(modelIdentifier: String!): FoundationModel!

  # Custom Models
  listCustomModels(
    baseModelArnEquals: String
    foundationModelArnEquals: String
    creationTimeBefore: AWSDateTime
    creationTimeAfter: AWSDateTime
    nameContains: String
    maxResults: Int
    nextToken: String
    sortBy: String
    sortOrder: SortOrder
  ): CustomModelConnection!

  getCustomModel(modelIdentifier: String!): CustomModel!

  # Customization Jobs
  listModelCustomizationJobs(
    creationTimeBefore: AWSDateTime
    creationTimeAfter: AWSDateTime
    statusEquals: CustomizationJobStatus
    nameContains: String
    maxResults: Int
    nextToken: String
    sortBy: String
    sortOrder: SortOrder
  ): CustomizationJobConnection!

  getModelCustomizationJob(jobIdentifier: String!): ModelCustomizationJob!

  # Provisioned Throughput
  listProvisionedModelThroughputs(
    creationTimeBefore: AWSDateTime
    creationTimeAfter: AWSDateTime
    statusEquals: ProvisionedThroughputStatus
    modelArnEquals: String
    nameContains: String
    maxResults: Int
    nextToken: String
    sortBy: String
    sortOrder: SortOrder
  ): ProvisionedThroughputConnection!

  getProvisionedModelThroughput(provisionedModelId: String!): ProvisionedModelThroughput!

  # Guardrails
  listGuardrails(
    guardrailIdentifier: String
    maxResults: Int
    nextToken: String
  ): GuardrailConnection!

  getGuardrail(guardrailIdentifier: String!, guardrailVersion: String): Guardrail!

  # Agents
  listAgents(
    maxResults: Int
    nextToken: String
  ): AgentConnection!

  getAgent(agentId: String!): Agent!

  listAgentAliases(
    agentId: String!
    maxResults: Int
    nextToken: String
  ): AgentAliasConnection!

  getAgentAlias(agentId: String!, agentAliasId: String!): AgentAlias!

  listAgentVersions(
    agentId: String!
    maxResults: Int
    nextToken: String
  ): AgentVersionConnection!

  getAgentVersion(agentId: String!, agentVersion: String!): AgentVersion!

  listAgentActionGroups(
    agentId: String!
    agentVersion: String!
    maxResults: Int
    nextToken: String
  ): AgentActionGroupConnection!

  getAgentActionGroup(agentId: String!, agentVersion: String!, actionGroupId: String!): AgentActionGroup!

  # Knowledge Bases
  listKnowledgeBases(
    maxResults: Int
    nextToken: String
  ): KnowledgeBaseConnection!

  getKnowledgeBase(knowledgeBaseId: String!): KnowledgeBase!

  # Data Sources
  listDataSources(
    knowledgeBaseId: String!
    maxResults: Int
    nextToken: String
  ): DataSourceConnection!

  getDataSource(knowledgeBaseId: String!, dataSourceId: String!): DataSource!

  # Ingestion Jobs
  listIngestionJobs(
    knowledgeBaseId: String!
    dataSourceId: String!
    maxResults: Int
    nextToken: String
    sortBy: String
    sortOrder: SortOrder
  ): IngestionJobConnection!

  getIngestionJob(knowledgeBaseId: String!, dataSourceId: String!, ingestionJobId: String!): IngestionJob!

  # Model Evaluation
  listModelEvaluationJobs(
    creationTimeBefore: AWSDateTime
    creationTimeAfter: AWSDateTime
    statusEquals: ModelEvaluationJobStatus
    nameContains: String
    maxResults: Int
    nextToken: String
    sortBy: String
    sortOrder: SortOrder
  ): ModelEvaluationJobConnection!

  getModelEvaluationJob(jobIdentifier: String!): ModelEvaluationJob!

  # Tags
  listTagsForResource(resourceARN: String!): [Tag!]!
}

# ─────────────────────────────────────────────
# Mutation Root
# ─────────────────────────────────────────────

type Mutation {
  # Model Invocation
  converse(input: ConverseInput!): ConverseResponse!
  invokeModel(input: InvokeModelInput!): InvokeModelResponse!

  # Custom Model Fine-Tuning
  createModelCustomizationJob(input: CreateCustomizationJobInput!): CreateCustomizationJobResult!
  stopModelCustomizationJob(jobIdentifier: String!): DeleteResult!
  deleteCustomModel(modelIdentifier: String!): DeleteResult!

  # Provisioned Throughput
  createProvisionedModelThroughput(input: CreateProvisionedThroughputInput!): CreateProvisionedThroughputResult!
  updateProvisionedModelThroughput(input: UpdateProvisionedThroughputInput!): ProvisionedModelThroughput!
  deleteProvisionedModelThroughput(provisionedModelId: String!): DeleteResult!

  # Guardrails
  createGuardrail(input: CreateGuardrailInput!): CreateGuardrailResult!
  updateGuardrail(input: UpdateGuardrailInput!): Guardrail!
  deleteGuardrail(guardrailIdentifier: String!, guardrailVersion: String): DeleteResult!
  createGuardrailVersion(guardrailIdentifier: String!, description: String, clientRequestToken: String): CreateGuardrailVersionResult!

  # Agents
  createAgent(input: CreateAgentInput!): CreateAgentResult!
  updateAgent(input: UpdateAgentInput!): Agent!
  deleteAgent(agentId: String!, skipResourceInUseCheck: Boolean): DeleteResult!
  prepareAgent(agentId: String!): PrepareAgentResult!

  createAgentAlias(input: CreateAgentAliasInput!): CreateAgentAliasResult!
  updateAgentAlias(agentId: String!, agentAliasId: String!, agentAliasName: String!, description: String, routingConfiguration: [AgentAliasRoutingConfigInput!]): AgentAlias!
  deleteAgentAlias(agentId: String!, agentAliasId: String!): DeleteResult!

  createAgentVersion(agentId: String!, description: String): AgentVersion!
  deleteAgentVersion(agentId: String!, agentVersion: String!, skipResourceInUseCheck: Boolean): DeleteResult!

  createAgentActionGroup(agentId: String!, agentVersion: String!, actionGroupName: String!, description: String, actionGroupExecutor: AWSJSON, apiSchema: AWSJSON): AgentActionGroup!
  updateAgentActionGroup(agentId: String!, agentVersion: String!, actionGroupId: String!, actionGroupName: String!, actionGroupState: String): AgentActionGroup!
  deleteAgentActionGroup(agentId: String!, agentVersion: String!, actionGroupId: String!, skipResourceInUseCheck: Boolean): DeleteResult!

  associateAgentKnowledgeBase(agentId: String!, agentVersion: String!, knowledgeBaseId: String!, description: String!, knowledgeBaseState: String): AssociateAgentKnowledgeBaseResult!
  disassociateAgentKnowledgeBase(agentId: String!, agentVersion: String!, knowledgeBaseId: String!): DeleteResult!

  # Knowledge Bases
  createKnowledgeBase(input: CreateKnowledgeBaseInput!): CreateKnowledgeBaseResult!
  updateKnowledgeBase(knowledgeBaseId: String!, name: String!, roleArn: String!, description: String, knowledgeBaseConfiguration: KnowledgeBaseConfigurationInput, storageConfiguration: StorageConfigurationInput): KnowledgeBase!
  deleteKnowledgeBase(knowledgeBaseId: String!): DeleteResult!

  # Data Sources
  createDataSource(input: CreateDataSourceInput!): CreateDataSourceResult!
  updateDataSource(knowledgeBaseId: String!, dataSourceId: String!, name: String!, description: String, dataSourceConfiguration: DataSourceConfigurationInput, serverSideEncryptionConfiguration: ServerSideEncryptionConfigurationInput, vectorIngestionConfiguration: VectorIngestionConfigurationInput): DataSource!
  deleteDataSource(knowledgeBaseId: String!, dataSourceId: String!): DeleteResult!

  # Ingestion Jobs
  startIngestionJob(knowledgeBaseId: String!, dataSourceId: String!, description: String, clientToken: String): StartIngestionJobResult!
  stopIngestionJob(knowledgeBaseId: String!, dataSourceId: String!, ingestionJobId: String!): IngestionJob!

  # Model Evaluation
  createModelEvaluationJob(input: CreateModelEvaluationJobInput!): CreateModelEvaluationJobResult!
  stopModelEvaluationJob(jobIdentifier: String!): DeleteResult!
  deleteModelEvaluationJob(jobIdentifier: String!): DeleteResult!

  # Tags
  tagResource(resourceARN: String!, tags: [TagInput!]!): DeleteResult!
  untagResource(resourceARN: String!, tagKeys: [String!]!): UntagResult!
}

# ─────────────────────────────────────────────
# Subscription Root
# ─────────────────────────────────────────────

type Subscription {
  """
  Subscribe to status changes for a model customization job.
  """
  onCustomizationJobStatusChange(jobArn: String!): ModelCustomizationJob
    @aws_subscribe(mutations: ["createModelCustomizationJob", "stopModelCustomizationJob"])

  """
  Subscribe to status changes for a provisioned model throughput resource.
  """
  onProvisionedThroughputStatusChange(provisionedModelArn: String!): ProvisionedModelThroughput
    @aws_subscribe(mutations: ["createProvisionedModelThroughput", "updateProvisionedModelThroughput"])

  """
  Subscribe to agent preparation status changes.
  """
  onAgentStatusChange(agentId: String!): Agent
    @aws_subscribe(mutations: ["createAgent", "updateAgent", "prepareAgent"])

  """
  Subscribe to knowledge base status changes.
  """
  onKnowledgeBaseStatusChange(knowledgeBaseId: String!): KnowledgeBase
    @aws_subscribe(mutations: ["createKnowledgeBase", "updateKnowledgeBase"])

  """
  Subscribe to ingestion job progress updates.
  """
  onIngestionJobUpdate(knowledgeBaseId: String!, dataSourceId: String!): IngestionJob
    @aws_subscribe(mutations: ["startIngestionJob", "stopIngestionJob"])

  """
  Subscribe to model evaluation job status changes.
  """
  onModelEvaluationJobStatusChange(jobIdentifier: String!): ModelEvaluationJob
    @aws_subscribe(mutations: ["createModelEvaluationJob", "stopModelEvaluationJob"])
}
