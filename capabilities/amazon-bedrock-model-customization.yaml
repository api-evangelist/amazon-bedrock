naftiko: 1.0.0-alpha2
info:
  label: Amazon Bedrock API — Model Customization
  description: 'Amazon Bedrock API — Model Customization. 3 operations. Lead operation: Amazon Bedrock Create a model customization
    job. Self-contained Naftiko capability covering one Amazon Bedrock business surface.'
  tags:
  - Amazon Bedrock
  - Model Customization
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_BEDROCK_API_KEY: AMAZON_BEDROCK_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-bedrock-model-customization
    baseUri: https://bedrock.{region}.amazonaws.com
    description: Amazon Bedrock API — Model Customization business capability. Self-contained, no shared references.
    resources:
    - name: model-customization-jobs
      path: /model-customization-jobs
      operations:
      - name: createmodelcustomizationjob
        method: POST
        description: Amazon Bedrock Create a model customization job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listmodelcustomizationjobs
        method: GET
        description: Amazon Bedrock List model customization jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: maxResults
          in: query
          type: integer
          description: Maximum number of results to return.
        - name: nextToken
          in: query
          type: string
          description: Token for pagination.
        - name: statusEquals
          in: query
          type: string
          description: Filter by job status.
    - name: model-customization-jobs-jobIdentifier
      path: /model-customization-jobs/{jobIdentifier}
      operations:
      - name: getmodelcustomizationjob
        method: GET
        description: Amazon Bedrock Get model customization job details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobIdentifier
          in: path
          type: string
          description: The identifier of the customization job.
          required: true
  exposes:
  - type: rest
    namespace: amazon-bedrock-model-customization-rest
    port: 8080
    description: REST adapter for Amazon Bedrock API — Model Customization. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/model-customization-jobs
      name: model-customization-jobs
      description: REST surface for model-customization-jobs.
      operations:
      - method: POST
        name: createmodelcustomizationjob
        description: Amazon Bedrock Create a model customization job
        call: amazon-bedrock-model-customization.createmodelcustomizationjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listmodelcustomizationjobs
        description: Amazon Bedrock List model customization jobs
        call: amazon-bedrock-model-customization.listmodelcustomizationjobs
        with:
          maxResults: rest.maxResults
          nextToken: rest.nextToken
          statusEquals: rest.statusEquals
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/model-customization-jobs/{jobidentifier}
      name: model-customization-jobs-jobidentifier
      description: REST surface for model-customization-jobs-jobIdentifier.
      operations:
      - method: GET
        name: getmodelcustomizationjob
        description: Amazon Bedrock Get model customization job details
        call: amazon-bedrock-model-customization.getmodelcustomizationjob
        with:
          jobIdentifier: rest.jobIdentifier
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-bedrock-model-customization-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Bedrock API — Model Customization. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: amazon-bedrock-create-model-customization
      description: Amazon Bedrock Create a model customization job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-bedrock-model-customization.createmodelcustomizationjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-bedrock-list-model-customization
      description: Amazon Bedrock List model customization jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-bedrock-model-customization.listmodelcustomizationjobs
      with:
        maxResults: tools.maxResults
        nextToken: tools.nextToken
        statusEquals: tools.statusEquals
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-bedrock-get-model-customization
      description: Amazon Bedrock Get model customization job details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-bedrock-model-customization.getmodelcustomizationjob
      with:
        jobIdentifier: tools.jobIdentifier
      outputParameters:
      - type: object
        mapping: $.
