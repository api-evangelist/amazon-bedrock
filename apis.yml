  - aid: amazon-bedrock:amazon-bedrock-runtime-api
    name: Amazon Bedrock Runtime API
    description: >-
      The Amazon Bedrock Runtime API provides operations for invoking
      foundation models for inference, including synchronous, streaming,
      and conversational invocation patterns (Converse API). Also supports
      guardrail evaluation and async batch inference. Authentication uses
      AWS Signature Version 4 (SigV4).
    humanURL: https://docs.aws.amazon.com/bedrock/latest/APIReference/
    baseURL: https://bedrock-runtime.us-east-1.amazonaws.com
    tags:
      - Foundation Models
      - Generative AI
      - Inference
      - Streaming
      - Converse
    properties:
      - type: Documentation
        url: https://docs.aws.amazon.com/bedrock/latest/APIReference/
      - type: OpenAPI
        url: openapi/amazon-bedrock-runtime-openapi.yml
  - aid: amazon-bedrock:amazon-bedrock-agent-api
    name: Amazon Bedrock Agent API
    description: >-
      The Amazon Bedrock Agent API provides operations for managing and
      configuring autonomous AI agents, knowledge bases for RAG, data
      sources, and ingestion jobs. Authentication uses AWS Signature
      Version 4 (SigV4).
    humanURL: https://docs.aws.amazon.com/bedrock/latest/APIReference/
    baseURL: https://bedrock-agent.us-east-1.amazonaws.com
    tags:
      - Agents
      - Knowledge Bases
      - RAG
    properties:
      - type: Documentation
        url: https://docs.aws.amazon.com/bedrock/latest/APIReference/
  - aid: amazon-bedrock:amazon-bedrock-agent-runtime-api
    name: Amazon Bedrock Agent Runtime API
    description: >-
      The Amazon Bedrock Agent Runtime API provides operations for invoking
      Bedrock agents and retrieving content from knowledge bases for RAG
      applications. Authentication uses AWS Signature Version 4 (SigV4).
    humanURL: https://docs.aws.amazon.com/bedrock/latest/APIReference/
    baseURL: https://bedrock-agent-runtime.us-east-1.amazonaws.com
    tags:
      - Agents
      - RAG
      - Retrieval
    properties:
      - type: Documentation
        url: https://docs.aws.amazon.com/bedrock/latest/APIReference/
