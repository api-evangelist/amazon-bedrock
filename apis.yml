aid: amazon-bedrock
name: Amazon Bedrock
description: Amazon Bedrock is a fully managed AWS service that makes high-performing
  foundation models from leading AI companies available through a unified API for
  building generative AI applications. It supports text and image generation, conversational
  AI, model customization and fine-tuning, retrieval-augmented generation (RAG) via
  knowledge bases, autonomous agents, guardrails for responsible AI, and provisioned
  throughput for production workloads. The Bedrock APIs are AWS regional service endpoints
  accessed over HTTPS using AWS Signature Version 4 (SigV4) authentication, typically
  via the AWS SDKs.
