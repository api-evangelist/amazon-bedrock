apis:
  - aid: amazon-bedrock:amazon-bedrock-api
    name: Amazon Bedrock API
    description: >-
      The Amazon Bedrock management API provides operations for managing
      foundation models, custom models, model customization jobs, provisioned
      throughput, guardrails, knowledge bases, agents, and model evaluation
      jobs. Authentication uses AWS Signature Version 4 (SigV4).
    humanURL: https://docs.aws.amazon.com/bedrock/latest/APIReference/
    baseURL: https://bedrock.us-east-1.amazonaws.com
    tags:
      - Foundation Models
      - Generative AI
      - Custom Models
      - Guardrails
      - Knowledge Bases
      - Agents
    properties:
      - type: Documentation
        url: https://docs.aws.amazon.com/bedrock/latest/APIReference/
